name: PHOTOBATCH Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          if ! find . -name settings.gradle.kts -print -quit | grep -q .; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'PHOTOBATCH-projeto.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "Não encontrei o projeto. Envie PHOTOBATCH-projeto.zip ou extraia seu conteúdo no repositório."
              exit 1
            fi
            mkdir -p .photobatch-source
            unzip -q "$ZIP_FILE" -d .photobatch-source
          fi
          PROJECT_DIR="$(dirname "$(find . -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts não foi encontrado."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PHOTOBATCH-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
